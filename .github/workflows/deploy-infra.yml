name: Deploy Infra

# Pipeline completo: cdk deploy de los 3 stacks de la app (Data/Storage/Api),
# vía CloudFormation. Puede crear recursos, rutas y permisos IAM nuevos — por
# eso es manual, nunca on push. Nunca toca CalorieCompanion-DevOps (ver
# infra:prod:deploy en package.json, que lo excluye por patrón de nombre).

on:
  workflow_dispatch: {}

permissions:
  id-token: write # requerido por GitHub OIDC hacia AWS
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: pnpm run infra:prod:deploy
