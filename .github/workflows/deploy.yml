name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # requerido por GitHub OIDC hacia AWS
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # El rol se asume vía GitHub OIDC — sin access keys de larga duración
      # en secrets de GitHub. El ARN del rol no es sensible, se guarda como
      # variable de repo (no secret). El rol en sí se crea a mano una vez
      # (ver CLAUDE.md → "Manejo de secretos").
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Stage resuelto por rama. Hoy solo existe main -> prod; un stage nuevo
      # se suma acá como otra rama del case, sin tocar infra/.
      - name: Resolve stage
        id: stage
        run: |
          case "${{ github.ref_name }}" in
            main) echo "stage=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "No hay stage definido para la rama ${{ github.ref_name }}" >&2; exit 1 ;;
          esac
      - run: pnpm run cdk:deploy -- -c stage=${{ steps.stage.outputs.stage }}
